<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 USDA Harvest Results</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --secondary:#86868b;
    --hairline:rgba(0,0,0,.08);
    --hairline-soft:rgba(0,0,0,.05);
    --green:#34c759;
    --amber:#ff9f0a;
    --red:#ff3b30;
    --blue:#0071e3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;-webkit-font-smoothing:antialiased;
    padding:48px 24px 96px;
  }
  .wrap{max-width:1240px;margin:0 auto}

  .head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
  h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}

  /* segmented control — the one place a choice is made */
  .seg{display:inline-flex;background:rgba(0,0,0,.05);border-radius:10px;padding:2px}
  .seg button{
    font:inherit;font-size:13px;font-weight:500;color:var(--text);
    border:none;background:none;padding:7px 15px;border-radius:8px;cursor:pointer;
    white-space:nowrap;transition:background .15s ease,box-shadow .15s ease;
  }
  .seg button:hover{color:#000}
  .seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .seg button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  .seglab{font-size:12px;font-weight:500;color:var(--secondary);margin-right:10px}

  /* summary tiles */
  .summary{
    display:flex;flex-wrap:wrap;background:var(--card);border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
    margin:26px 0 22px;overflow:hidden;
  }
  .stat{flex:1 1 230px;min-width:200px;padding:18px 22px 17px;border-right:1px solid var(--hairline-soft)}
  .stat:last-child{border-right:none}
  .stat .k{font-size:12px;font-weight:500;color:var(--secondary)}
  .stat .v{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:14px;font-weight:400;color:var(--secondary);margin-left:3px}
  .stat .v.mute{color:var(--secondary);font-weight:500}
  .ysub{font-size:11.5px;color:var(--secondary);margin-top:9px;font-variant-numeric:tabular-nums;min-height:14px}
  .neg{color:var(--red)} .pos{color:var(--green)}
  .stat .k small{font-weight:400;color:var(--secondary)}
  .meter{height:4px;background:rgba(0,0,0,.06);border-radius:2px;margin-top:11px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px;background:var(--green);
    transition:width .5s cubic-bezier(.25,.1,.25,1)}

  .cols{display:grid;grid-template-columns:minmax(0,318px) minmax(0,1fr);gap:22px;align-items:start}
  .card{
    background:var(--card);border-radius:18px;min-width:0;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
  }
  .card>header{padding:17px 20px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
  .card h2 span{color:var(--secondary);font-weight:500}
  .cap{font-size:12px;color:var(--secondary)}

  /* variance ladder */
  .ladder{padding:8px 8px 6px}
  .rung{
    all:unset;display:grid;grid-template-columns:54px 1fr 74px;align-items:center;gap:10px;
    width:100%;box-sizing:border-box;padding:5px 12px;border-radius:8px;cursor:pointer;
  }
  .rung:hover{background:rgba(0,0,0,.03)}
  .rung:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .rung .code{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.01em}
  .track{position:relative;height:12px}
  .track:before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--hairline-soft)}
  .bar{position:absolute;top:2px;height:8px;border-radius:4px;transition:width .4s cubic-bezier(.25,.1,.25,1)}
  .rung .num{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;color:var(--secondary)}
  .ladfoot{display:flex;justify-content:space-between;font-size:11px;color:var(--secondary);
    padding:8px 20px 16px;font-variant-numeric:tabular-nums}

  /* tools */
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px 12px}
  select,input[type=search]{
    font:inherit;font-size:13.5px;color:var(--text);
    border:none;border-radius:10px;background:rgba(0,0,0,.05);
    padding:8px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;
  }
  select{padding-right:26px;max-width:168px;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--secondary) 50%),linear-gradient(135deg,var(--secondary) 50%,transparent 50%);
    background-position:calc(100% - 14px) 55%,calc(100% - 9px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  input[type=search]{cursor:text;width:150px}
  select:focus-visible,input:focus-visible{box-shadow:0 0 0 3px rgba(0,113,227,.3)}
  .link{font:inherit;font-size:13.5px;color:var(--blue);background:none;border:none;cursor:pointer;padding:4px 2px}
  .link:hover{text-decoration:underline}
  .link:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--secondary);cursor:pointer;white-space:nowrap}
  .chk input{accent-color:var(--blue);width:15px;height:15px;margin:0}
  .tools .right{margin-left:auto;display:inline-flex;gap:14px;align-items:center}
  @media (max-width:1100px){.tools .right{margin-left:0}}

  /* table — lines only where a line means something */
  .scroll{overflow-x:auto;min-width:0;border-radius:0 0 18px 18px}
  table{border-collapse:collapse;width:100%;min-width:780px}
  thead th{
    font-size:12px;font-weight:500;color:var(--secondary);
    padding:12px 14px 10px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--hairline);
    position:sticky;top:0;background:var(--card);z-index:2;cursor:pointer;
  }
  thead th:first-child{text-align:left;padding-left:20px}
  thead th:hover{color:var(--text)}
  thead th .caret{color:var(--blue);font-size:9px;vertical-align:1px}

  td{padding:7px 14px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  td:first-child{text-align:left}
  tr.lv1 td{padding-top:12px;padding-bottom:12px;border-top:1px solid rgba(0,0,0,.04);cursor:pointer}
  tr.lv1:first-child td{border-top:none}
  tr.lv1 td:first-child{font-size:15px;font-weight:600;letter-spacing:-.01em;padding-left:20px}
  tr.lv1:hover td{background:rgba(0,0,0,.02)}
  tr.lv2 td{cursor:pointer}
  tr.lv2 td:first-child{padding-left:38px;font-weight:500}
  tr.lv2:hover td{background:rgba(0,0,0,.02)}
  tr.lv3 td{color:var(--secondary)}
  tr.lv3 td:first-child{padding-left:58px}
  tr.lv3 td.hold{color:var(--text);font-weight:500}
  tr.pend td{color:var(--secondary)}
  tr.pend td:first-child{font-weight:500}
  .chev{display:inline-block;width:6px;height:6px;margin-right:9px;vertical-align:1px;
    border-right:1.5px solid var(--secondary);border-bottom:1.5px solid var(--secondary);
    transform:rotate(-45deg);transition:transform .18s ease}
  tr.open>td .chev{transform:rotate(45deg)}
  .chev.none{border:none}
  .tag{font-size:11px;color:var(--secondary);margin-left:8px;font-weight:400}
  .yin{
    width:66px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums;
    text-align:right;color:var(--blue);background:rgba(0,113,227,.08);
    border:none;border-radius:7px;padding:3px 7px;-moz-appearance:textfield;
  }
  .yin:hover{background:rgba(0,113,227,.14)}
  .yin:focus{outline:none;box-shadow:0 0 0 3px rgba(0,113,227,.3)}
  .yin::-webkit-outer-spin-button,.yin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  tfoot td{padding:14px;font-weight:600;border-top:1px solid var(--hairline);background:rgba(0,0,0,.015)}
  tfoot td:first-child{padding-left:20px}
  .empty{padding:34px 20px;color:var(--secondary)}
  .banner{display:none;background:#fff4e5;color:#7a4b00;border:1px solid #ffd591;
    border-radius:12px;padding:11px 15px;font-size:13px;line-height:1.5;margin:22px 0 -4px}
  .banner.show{display:block}
  .banner code{background:rgba(0,0,0,.06);border-radius:4px;padding:1px 5px;font-size:12px}
  .savenote{font-size:12px;color:var(--secondary);white-space:nowrap}
  .savenote.err{color:var(--red)}
  .yin.mine{color:var(--amber);background:rgba(255,159,10,.12)}
  .yin.mine:hover{background:rgba(255,159,10,.2)}
  .note{font-size:12px;color:var(--secondary);margin-top:16px;line-height:1.7;max-width:860px}
  .note b{color:var(--text);font-weight:500}

  @media (max-width:980px){
    .cols{grid-template-columns:minmax(0,1fr)}
    body{padding:24px 12px 60px}
    h1{font-size:27px}
  }
  @media (max-width:700px){
    .head{align-items:flex-start}
    .head>div{flex-direction:column;align-items:flex-start!important;gap:8px;width:100%}
    .seglab{margin:0}
    .seg{width:100%}
    .seg button{flex:1;padding:8px 6px;font-size:12.5px}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline-soft)}
    .stat{background:var(--card);border-right:none;padding:14px 16px;min-width:0}
    .stat .v{font-size:21px}
    input[type=search]{width:100%}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>2026 USDA Harvest Results</h1>
    <div style="display:flex;align-items:center">
      <span class="seglab">Compare with</span>
      <div class="seg" id="basis" role="group" aria-label="Comparison basis">
        <button data-b="y25" aria-pressed="false">2025 Actual</button>
        <button data-b="yrf" aria-pressed="true">2026 Reforecast</button>
        <button data-b="ybd" aria-pressed="false">2026 Budget</button>
      </div>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="summary" id="tote"></div>

  <div class="cols">
    <section class="card">
      <header><h2>Variance by ranch <span id="ladderCount"></span></h2></header>
      <div class="ladder" id="ladder"></div>
      <div class="ladfoot"><span id="scaleL"></span><span id="ladderNote"></span><span id="scaleR"></span></div>
    </section>

    <section class="card">
      <div class="tools">
        <input type="search" id="q" placeholder="Search" aria-label="Search block or variety">
        <select id="fFund"></select>
        <select id="fClass"></select>
        <select id="fAM"></select>
        <select id="fFM"></select>
        <button class="link" id="tExpand">Expand all</button>
        <span class="right">
          <span class="savenote" id="status"></span>
          <button class="link" id="refreshBtn">Refresh</button>
          <button class="link" id="reset" hidden>Clear my edits</button>
          <button class="link" id="dl">Export CSV</button>
        </span>
      </div>
      <div class="scroll">
        <table id="grid">
          <thead><tr>
            <th data-s="name">Ranch / block / variety</th>
            <th data-s="ac">Acres</th>
            <th data-s="y26">2026 lb/ac</th>
            <th data-s="yb">Basis lb/ac</th>
            <th data-s="l26">2026 lbs</th>
            <th data-s="dl">Var lbs</th>
            <th data-s="dp">Var %</th>
          </tr></thead>
          <tbody id="body"></tbody>
          <tfoot id="foot"></tfoot>
        </table>
      </div>
    </section>
  </div>

  <p class="note" id="footnote"></p>
</div>

const BASIS = {y25:{lab:"2025 Actual",short:"2025"},yrf:{lab:"2026 Reforecast",short:"Reforecast"},ybd:{lab:"2026 Budget",short:"Budget"}};
const S = {basis:"yrf", fund:"", cls:"", am:"", fm:"", q:"", sort:"name", dir:1,
           open:new Set(), edits:{}};

DATA.forEach((r,i)=>r.i=i);
let SHEET = {};                // block-variety -> lb/ac, from the sheet
const y26 = r => S.edits[r.i] !== undefined ? S.edits[r.i]
               : (SHEET[r.bv] != null ? SHEET[r.bv] : null);
const fromSheet = r => S.edits[r.i] === undefined && SHEET[r.bv] != null;
const yb  = r => r[S.basis];
const nat = s => s.replace(/\d+/g, m => m.padStart(6,"0"));
const fmt = n => n==null ? "—" : Math.round(n).toLocaleString("en-US");
const ac2 = n => n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pc  = (d,b) => (b===0||b==null) ? "—" : (d/b>=0?"+":"") + (100*d/b).toFixed(1) + "%";
const cls = n => n>0.5 ? "pos" : n<-0.5 ? "neg" : "";
const sign = d => (d>=0?"+":"−") + fmt(Math.abs(d));

function rows(){
  return DATA.filter(r=>{
    if(S.fund && r.fd!==S.fund) return false;
    if(S.cls  && r.cl!==S.cls)  return false;
    if(S.am   && r.am!==S.am)   return false;
    if(S.fm   && r.fm!==S.fm)   return false;
    if(S.q){ const q=S.q.toLowerCase();
      if(!(r.bv+" "+r.hb+" "+r.vr+" "+r.rn).toLowerCase().includes(q)) return false; }
    return true;
  });
}
/* Variance compares like with like: only blocks with a 2026 entry count on
   BOTH sides. A part-entered book measured against a full-book plan would read
   as a false collapse, which is the whole reason the seeded numbers came out. */
function agg(list){
  const a={ac:0,n:list.length,nEnt:0,acEnt:0,l26:0,lbEnt:0,lbAll:0,acb:0};
  list.forEach(r=>{
    const v=y26(r), b=yb(r);
    a.ac+=r.ac;
    if(b>0){ a.lbAll+=b*r.ac; a.acb+=r.ac; }
    if(v!=null){ a.nEnt++; a.acEnt+=r.ac; a.l26+=v*r.ac; a.lbEnt+=(b||0)*r.ac; }
  });
  a.d   = a.nEnt ? a.l26-a.lbEnt : null;
  a.y26 = a.acEnt ? a.l26/a.acEnt : null;
  a.yb  = a.acb ? a.lbAll/a.acb : null;
  a.lb  = a.lbAll;
  return a;
}

/* ---------- summary tiles ---------- */
function tote(list){
  const a=agg(list), B=BASIS[S.basis];
  document.getElementById("tote").innerHTML = `
    <div class="stat"><div class="k">2026 USDA harvest</div>
      <div class="v">${a.nEnt?fmt(a.l26):"—"}${a.nEnt?"<small>lbs</small>":""}</div>
      <div class="ysub">${a.nEnt
        ? fmt(a.y26)+" lb/ac · "+a.nEnt+" of "+a.n+" blocks entered"
        : "no weights entered · "+a.n+" blocks awaiting"}</div>
      <div class="meter"><i style="width:${a.n?a.nEnt/a.n*100:0}%"></i></div></div>
    <div class="stat"><div class="k">${B.lab}</div>
      <div class="v mute">${fmt(a.lb)}<small>lbs</small></div>
      <div class="ysub">${fmt(a.yb)} lb/ac on ${fmt(a.acb)} acres</div></div>
    <div class="stat"><div class="k">Variance <small>entered blocks</small></div>
      <div class="v ${cls(a.d)}">${a.d==null?"—":sign(a.d)}</div>
      <div class="ysub ${cls(a.d)}">${a.d==null
        ? "waiting on 2026 weights"
        : pc(a.d,a.lbEnt)+" vs "+B.short+" on "+fmt(a.acEnt)+" acres"}</div></div>`;
}

/* ---------- variance ladder ---------- */
function ladder(list){
  const by={};
  list.forEach(r=>{ (by[r.rn]=by[r.rn]||[]).push(r); });
  const arr=Object.entries(by).map(([rn,rs])=>({rn,...agg(rs)})).filter(x=>x.nEnt>0)
              .sort((a,b)=>(a.d-b.d) || nat(a.rn).localeCompare(nat(b.rn)));
  const max=Math.max(1,...arr.map(x=>Math.abs(x.d)));
  const el=document.getElementById("ladder");
  el.innerHTML = arr.length ? arr.map(x=>{
    const w=Math.abs(x.d)/max*50, neg=x.d<0, flat=Math.abs(x.d)<1;
    return `<button class="rung" data-rn="${x.rn}">
      <span class="code">${x.rn}</span>
      <span class="track"><span class="bar" style="${neg?"right:50%":"left:50%"};width:${w}%;
        background:${neg?"var(--red)":"var(--green)"};opacity:${flat?0:1}"></span></span>
      <span class="num ${cls(x.d)}">${flat?"—":sign(x.d/1000)+"k"}</span></button>`;
  }).join("") : `<div class="empty">Nothing to compare yet. Enter a 2026 lb/ac on any block and its ranch appears here.</div>`;
  document.getElementById("ladderCount").textContent = arr.length ? "· "+arr.length : "";
  const flat = arr.every(x=>Math.abs(x.d)<1);
  document.getElementById("scaleL").textContent = flat||!arr.length ? "" : "−"+fmt(max/1000)+"k lbs";
  document.getElementById("scaleR").textContent = flat||!arr.length ? "" : "+"+fmt(max/1000)+"k lbs";
  document.getElementById("ladderNote").textContent =
    flat && arr.length ? "Flat — 2026 still matches "+BASIS[S.basis].short : "";
  el.querySelectorAll(".rung").forEach(b=>b.onclick=()=>{
    const rn=b.dataset.rn;
    if(S.open.has(rn)) S.open.delete(rn); else S.open.add(rn);
    render();
    const t=document.querySelector(`tr[data-key="${rn}"]`);
    if(t) t.scrollIntoView({block:"center",behavior:"smooth"});
  });
}

/* ---------- table ---------- */
function line(level,key,name,a,opts={}){
  const {toggle=false,tag="",input=null,foot=false}=opts;
  const chev = toggle ? `<span class="chev"></span>` : (level<3?`<span class="chev none"></span>`:"");
  const open = toggle && S.open.has(key) ? " open" : "";
  return `<tr class="lv${level}${open}${a.nEnt?"":" pend"}" data-key="${key}"${toggle?' data-t="1"':""}>
    <td>${chev}${name}${tag?`<span class="tag">${tag}</span>`:""}</td>
    <td>${ac2(a.ac)}</td>
    <td class="hold">${input!==null?input:(a.y26==null?"—":fmt(a.y26))}</td>
    <td>${a.yb==null?"—":fmt(a.yb)}</td>
    <td class="hold">${a.nEnt?fmt(a.l26):"—"}</td>
    <td class="${cls(a.d)}">${a.d==null?"—":sign(a.d)}</td>
    <td class="${cls(a.d)}">${a.d==null?"—":pc(a.d,a.lbEnt)}</td></tr>`;
}
const KEY={name:x=>nat(x.name),ac:x=>x.a.ac,y26:x=>x.a.y26,yb:x=>x.a.yb,
           l26:x=>x.a.l26,dl:x=>(x.a.d==null?-Infinity:x.a.d),dp:x=>(x.a.d!=null&&x.a.lbEnt?x.a.d/x.a.lbEnt:-Infinity)};
function sortBy(list){
  const f=KEY[S.sort]||KEY.name;
  return list.sort((a,b)=>{const x=f(a),y=f(b);
    return (typeof x==="string"? x.localeCompare(y) : x-y)*S.dir;});
}
function table(list){
  const by={};
  list.forEach(r=>{ (by[r.rn]=by[r.rn]||[]).push(r); });
  let html="";
  sortBy(Object.entries(by).map(([rn,rs])=>({name:rn,rs,a:agg(rs)}))).forEach(R=>{
    html+=line(1,R.name,R.name,R.a,{toggle:true});
    if(!S.open.has(R.name)) return;
    const blocks={};
    R.rs.forEach(r=>{ (blocks[r.hb]=blocks[r.hb]||[]).push(r); });
    sortBy(Object.entries(blocks).map(([hb,rs])=>({name:hb,rs,a:agg(rs)}))).forEach(B=>{
      const bk=R.name+"|"+B.name, multi=B.rs.length>1;
      html+=line(2,bk,B.name,B.a,{toggle:multi});
      if(multi && !S.open.has(bk)) return;
      sortBy(B.rs.map(r=>({name:r.bv,r,a:agg([r])}))).forEach(V=>{
        const r=V.r, cur=y26(r);
        const mine=S.edits[r.i]!==undefined;
        const inp=`<input class="yin${mine?" mine":""}" type="number" step="10" min="0" data-i="${r.i}"
           value="${cur==null?"":Math.round(cur)}" title="${mine?"Your entry — Clear my edits reverts to the sheet":(fromSheet(r)?"From the sheet":"Not weighed yet")}"
           aria-label="2026 yield for ${r.bv}">`;
        html+=line(3,r.bv,r.vr,V.a,{input:inp, tag: yb(r)==null?"no basis":""});
      });
    });
  });
  const b=document.getElementById("body");
  b.innerHTML = html || `<tr><td colspan="7" class="empty">No blocks match these filters. Clear one and try again.</td></tr>`;
  document.getElementById("foot").innerHTML = list.length
    ? line(1,"__t","Total",agg(list)).replace('class="lv1"','class="tot"').replace('<span class="chev none"></span>','')
    : "";
  b.querySelectorAll("tr[data-t]").forEach(tr=>tr.onclick=e=>{
    if(e.target.classList.contains("yin")) return;
    const k=tr.dataset.key; S.open.has(k)?S.open.delete(k):S.open.add(k); render();
  });
  b.querySelectorAll(".yin").forEach(inp=>{
    inp.onchange=()=>{
      const i=+inp.dataset.i, v=inp.value.trim();
      if(v==="") delete S.edits[i]; else S.edits[i]=Math.max(0,+v);
      render();
    };
    inp.onclick=e=>e.stopPropagation();
  });
}

/* ---------- chrome ---------- */
function fillSelect(id,label,vals){
  const s=document.getElementById(id);
  s.innerHTML=`<option value="">${label}</option>`+
    [...new Set(vals)].sort((a,b)=>nat(a).localeCompare(nat(b)))
      .map(v=>`<option>${v}</option>`).join("");
}
function render(){
  const list=rows();
  tote(list); ladder(list); table(list);
  document.querySelectorAll("#basis button").forEach(b=>
    b.setAttribute("aria-pressed", b.dataset.b===S.basis));
  document.querySelectorAll("thead th").forEach(th=>{
    th.innerHTML = th.textContent.replace(/[▲▼]/g,"").trim() +
      (th.dataset.s===S.sort ? ` <span class="caret">${S.dir>0?"▲":"▼"}</span>` : "");
  });
  const n=Object.keys(S.edits).length;
  document.getElementById("reset").hidden = !n;
  document.getElementById("footnote").innerHTML =
    `<b>2026 weights come from the GLF Yield Master sheet</b> via its Apps Script feed — column S, total field lbs — and lb/ac is computed here from acres. Hit Refresh to pull the latest. A block with no weight yet reads “—” and sits out of the comparison. You can also type a <b>2026 lb/ac</b> into the table to model a number without touching the sheet; those show in amber, live in this browser only, and Clear my edits reverts them to the sheet${n?` — <b>${n} of your own</b>`:""}. ` +
    `Variance counts only blocks with a 2026 entry, on both sides — a part-entered book measured against the full plan would read as a false collapse. ` +
    `Reforecast and Budget come from the source file's 2026 columns; 2025 Actual is the USDA column. Lbs = acres × lb/ac at block-variety level. ` +
    `Out of scope here but present in the workbook: the 28 non-bearing block-varieties (GLF15, GLF21, the GLF23 pistachios, GLF5-3 nonpareil, GLF9 pecans) and GLF8 dates.`;
}
document.getElementById("basis").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return; S.basis=b.dataset.b; render();
};
document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
  if(S.sort===th.dataset.s) S.dir*=-1; else {S.sort=th.dataset.s; S.dir = th.dataset.s==="name"?1:-1;}
  render();
});
const bind=(id,key)=>document.getElementById(id).onchange=e=>{S[key]=e.target.value;S.open.clear();render();};
bind("fFund","fund"); bind("fClass","cls"); bind("fAM","am"); bind("fFM","fm");
document.getElementById("q").oninput=e=>{S.q=e.target.value;render();};
document.getElementById("tExpand").onclick=e=>{
  if(S.open.size){S.open.clear(); e.target.textContent="Expand all";}
  else{ rows().forEach(r=>{S.open.add(r.rn); S.open.add(r.rn+"|"+r.hb);});
        e.target.textContent="Collapse all"; }
  render();
};
document.getElementById("reset").onclick=()=>{S.edits={};render();};
document.getElementById("dl").onclick=()=>{
  const B=BASIS[S.basis], head=["Ranch","Harvest Block","Block-Variety","Variety","Fund",
    "Reporting Classification","AM","FM","Acres","Yield 2026 lb/ac",B.lab+" lb/ac",
    "Total 2026 lbs",B.lab+" lbs","Var lbs","Var %"];
  const lines=[head.join(",")];
  rows().forEach(r=>{
    const v=y26(r)||0,b=yb(r)||0,l=v*r.ac,lb=b*r.ac,d=l-lb;
    lines.push([r.rn,r.hb,r.bv,r.vr,r.fd,r.cl,r.am,r.fm,r.ac.toFixed(2),v,b,
      l.toFixed(0),lb.toFixed(0),d.toFixed(0),lb?(100*d/lb).toFixed(1):""]
      .map(x=>/[",]/.test(x)?`"${x}"`:x).join(","));
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));
  a.download=`GLF_2026_harvest_vs_${B.short.toLowerCase()}.csv`; a.click();
  URL.revokeObjectURL(a.href);
};
/* ---------- sheet loading ---------- */
function setStatus(msg,isErr){
  const el=document.getElementById("status");
  el.textContent=msg||""; el.classList.toggle("err",!!isErr);
}
function showBanner(html){
  const b=document.getElementById("banner");
  if(!html){ b.classList.remove("show"); return; }
  b.innerHTML=html; b.classList.add("show");
}
function resolveUrl(u){ return (!u || u.indexOf("PASTE_")===0) ? null : u; }
const num = v => {
  if(v==null) return null;
  const n=parseFloat(String(v).replace(/[,$%\s]/g,""));
  return isFinite(n)?n:null;
};
const ACRES={}, BV={};
DATA.forEach(r=>{ const k=r.bv.toUpperCase(); ACRES[k]=r.ac; BV[k]=r.bv; });
const KEYS=new Set(Object.keys(ACRES));

/* The feed arrives as [{ "Block-Variety": "GLF7-1-NP", "2026 Harvest lbs": 201000 }, ...].
   lbs -> lb/ac happens here, against the block's acres held on this page.
   A 0 is kept (harvested nothing); a missing row means not weighed yet and the
   block simply stays out of the comparison. */
function ingest(rows){
  if(!Array.isArray(rows)) return {err:"no-key-column"};
  if(!rows.length) return {map:{},n:0,bad:[],stray:[]};
  const first=rows[0];
  if(!(KEY_HEADER in first)) return {err:"no-key-column"};
  if(!(LBS_HEADER in first)) return {err:"no-lbs-column"};
  const map={}, bad=[], stray=[]; let n=0;
  rows.forEach(row=>{
    const k=String(row[KEY_HEADER]||"").trim().toUpperCase();
    if(!k) return;
    const lb=num(row[LBS_HEADER]);
    if(OUT_OF_SCOPE.has(k)){ if(lb>0) stray.push(k); return; }
    if(!KEYS.has(k)){ if(lb>0) bad.push(k); return; }
    if(lb==null) return;
    const ac=ACRES[k];
    if(!ac) return;
    map[BV[k]]=Math.max(0,lb/ac); n++;
  });
  return {map,n,bad,stray};
}
function readCache(){ try{const r=localStorage.getItem(CACHE_KEY);return r?JSON.parse(r):null}catch(e){return null} }
function writeCache(d){ try{localStorage.setItem(CACHE_KEY,JSON.stringify(d))}catch(e){} }

async function loadSheet(initial){
  const url=resolveUrl(API_URL);
  if(initial){
    const c=readCache();
    if(c && c.map){ SHEET=c.map; render();
      setStatus("As of "+new Date(c.updated).toLocaleTimeString()); }
  }
  if(!url){
    showBanner("<b>No sheet connected yet.</b> In the GLF Yield Master sheet: Extensions \u25b8 Apps Script, paste <code>AppsScript_Code.gs</code>, Deploy \u25b8 Web app (Execute as: Me \u00b7 Access: Anyone), then paste the <code>/exec</code> URL into <code>API_URL</code> near the top of this file. Until then you can still type weights straight into the table.");
    setStatus(""); return;
  }
  if(!initial) setStatus("Refreshing\u2026");
  try{
    const res=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const text=await res.text();
    let data;
    try{ data=JSON.parse(text); }
    catch(e){ throw new Error("the URL didn't return JSON — check it ends in /exec and is deployed to \u201cAnyone\u201d"); }
    /* the script reports its own failures rather than returning junk */
    if(data.error) throw new Error(data.error);
    const raw=data.rows||[];
    const out=ingest(raw);
    if(out.err==="no-key-column") throw new Error("the feed had no "+KEY_HEADER+" field");
    if(out.err==="no-lbs-column") throw new Error("the feed had no \u201c"+LBS_HEADER+"\u201d field");
    SHEET=out.map;
    const when=data.updated?new Date(data.updated):new Date();
    writeCache({updated:when.toISOString(),map:out.map});
    render();
    setStatus((out.n?out.n+" weighed":"nothing weighed yet")+" \u00b7 "+when.toLocaleTimeString());
    const warn=[];
    if(out.bad.length) warn.push("<b>"+out.bad.length+" weighed row"+(out.bad.length>1?"s":"")+
      " didn't match a block-variety</b> and "+(out.bad.length>1?"were":"was")+" skipped: <code>"+
      out.bad.slice(0,6).join("</code> <code>")+"</code>"+(out.bad.length>6?" and more":"")+
      ". Keys must match column G of the master exactly.");
    if(out.stray.length) warn.push("<b>"+out.stray.length+" block"+(out.stray.length>1?"s":"")+
      " outside this dashboard now ha"+(out.stray.length>1?"ve":"s")+" a 2026 weight</b>: <code>"+
      out.stray.slice(0,6).join("</code> <code>")+"</code>. Those lbs are in the master but not counted here \u2014 "+
      "worth adding them back to scope.");
    showBanner(warn.join("<br>"));
  }catch(err){
    if(Object.keys(SHEET).length){ setStatus("Showing saved copy",true); }
    else{
      setStatus("Load failed",true);
      showBanner("<b>Couldn't read the sheet.</b> "+err.message+
        ". Opening the <code>/exec</code> URL in a browser shows what the script is returning; add <code>?diag=1</code> to see which columns it found. You can still type weights in by hand.");
    }
  }
}
document.getElementById("refreshBtn").onclick=()=>loadSheet(false);

fillSelect("fFund","All funds",DATA.map(r=>r.fd));
fillSelect("fClass","All classifications",DATA.map(r=>r.cl));
fillSelect("fAM","All AMs",DATA.map(r=>r.am));
fillSelect("fFM","All FMs",DATA.map(r=>r.fm));
render();
loadSheet(true);
</script>
