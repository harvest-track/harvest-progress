<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estimate My Yield · Estimar Mi Rendimiento</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --secondary:#86868b;
    --hairline:rgba(0,0,0,.08); --hairline-soft:rgba(0,0,0,.05);
    --green:#34c759; --amber:#ff9f0a; --red:#ff3b30; --blue:#0071e3; --fill:#f5f5f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased; padding:40px 20px 96px;
  }
  .wrap{max-width:760px;margin:0 auto}

  .top{display:flex;align-items:flex-start;gap:16px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin-bottom:6px}
  h1{font-size:32px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
  .sub{color:var(--secondary);font-size:15px;margin-top:8px}

  .lang{margin-left:auto;flex:none;display:flex;background:rgba(0,0,0,.05);border-radius:9px;padding:2px}
  .lang button{
    all:unset;cursor:pointer;font:inherit;font-size:12px;font-weight:600;
    padding:5px 11px;border-radius:7px;color:var(--secondary);
  }
  .lang button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .lang button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

  .card{
    background:var(--card);border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
    padding:22px;margin-top:24px;
  }
  .card h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--secondary);margin-bottom:16px}
  .step{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--text);color:#fff;
    font-size:11px;font-weight:700;text-align:center;line-height:18px;margin-right:7px;vertical-align:1px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .f{display:flex;flex-direction:column;gap:6px}
  .f.full{grid-column:1/-1}
  label{font-size:12px;font-weight:500;color:var(--secondary)}
  select,input[type="number"]{
    font:inherit;font-size:16px;padding:11px 13px;border:none;border-radius:11px;
    background:var(--fill);color:var(--text);outline:none;width:100%;
    -webkit-appearance:none;appearance:none;
  }
  select{background-image:linear-gradient(45deg,transparent 50%,var(--secondary) 50%),linear-gradient(135deg,var(--secondary) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
  select:focus,input:focus{box-shadow:0 0 0 3px rgba(0,113,227,.3)}
  select:disabled{color:var(--secondary);opacity:.6}
  .hint{font-size:11px;color:var(--secondary);min-height:14px}
  .hint b{color:var(--text);font-weight:600}
  #blockHint{font-size:13.5px;line-height:1.5;min-height:18px;font-variant-numeric:tabular-nums}
  #blockHint b{font-weight:600}

  .seg{display:flex;background:rgba(0,0,0,.05);border-radius:11px;padding:3px;gap:2px}
  .seg button{
    all:unset;flex:1;cursor:pointer;font:inherit;font-size:13px;font-weight:500;
    text-align:center;padding:8px 4px;border-radius:8px;color:var(--secondary);
  }
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .seg button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .seg.two button{font-size:12px}

  .out{margin-top:24px}
  .hero{
    background:var(--card);border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
    padding:24px 22px;
  }
  .hero .k{font-size:12px;font-weight:500;color:var(--secondary)}
  .big{font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:4px}
  .big small{font-size:16px;font-weight:400;color:var(--secondary);letter-spacing:0}
  .range{font-size:13px;color:var(--secondary);margin-top:8px;font-variant-numeric:tabular-nums}
  .cmp{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:13px;font-weight:600;
    padding:5px 11px;border-radius:20px;background:rgba(0,0,0,.05);font-variant-numeric:tabular-nums}
  .cmp.up{background:rgba(52,199,89,.14);color:#1c7c33}
  .cmp.down{background:rgba(255,59,48,.12);color:#c0261d}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .tile{background:var(--card);border-radius:14px;padding:15px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.03)}
  .tile .k{font-size:11px;font-weight:500;color:var(--secondary)}
  .tile .v{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}

  .why{margin-top:12px}
  .fx{display:flex;flex-direction:column}
  .fx .r{
    display:flex;align-items:baseline;gap:12px;padding:11px 0;
    border-top:1px solid var(--hairline-soft);font-size:14px;line-height:1.5;
    font-variant-numeric:tabular-nums;
  }
  .fx .r:first-child{border-top:none}
  .fx .lb{flex:none;width:98px;font-size:11px;font-weight:500;color:var(--secondary);
    text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  .fx .eq{color:var(--secondary)}
  .fx .eq b{color:var(--text);font-weight:600}
  .fx .r.res{border-top:1px solid var(--hairline);font-size:15px}
  .fx .r.res .eq b{font-weight:700}
  .src{font-size:11px;color:var(--secondary);margin-top:3px;font-style:italic}
  @media (max-width:640px){
    .fx .r{flex-direction:column;gap:3px}
    .fx .lb{width:auto;padding-top:0}
  }

  .flag{
    display:flex;gap:10px;background:#fff4e5;border:1px solid #ffd591;color:#7a4b00;
    border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.5;margin-top:12px;
  }
  .flag.info{background:rgba(0,113,227,.06);border-color:rgba(0,113,227,.22);color:#0a4f9c}
  .flag .ic{flex:none;font-weight:700}

  .empty{color:var(--secondary);font-size:14px;text-align:center;padding:34px 20px;line-height:1.6}

  .actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .btn{all:unset;cursor:pointer;font:inherit;font-size:14px;font-weight:500;color:var(--blue);padding:6px 2px}
  .btn:hover{text-decoration:underline}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .hidden{display:none!important}

  @media (max-width:640px){
    body{padding:22px 12px 64px}
    h1{font-size:25px}
    .grid{grid-template-columns:1fr}
    .tiles{grid-template-columns:1fr;gap:10px}
    .tile{display:flex;align-items:baseline;justify-content:space-between}
    .tile .v{margin-top:0}
    .big{font-size:38px}
    .seg button{font-size:12px;padding:9px 3px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <div class="eyebrow" data-t="eyebrow">Crop Year 2026</div>
      <h1 data-t="title">Estimate My Yield</h1>
      <div class="sub" data-t="sub">Pick your ranch and variety, enter your loads, and see the estimate with the reasoning behind it.</div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="btnEn" aria-pressed="true">EN</button>
      <button id="btnEs" aria-pressed="false">ES</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="step">1</span><span data-t="h1">Your block</span></h2>
    <div class="grid">
      <div class="f">
        <label for="farm" data-t="lFarm">Ranch</label>
        <select id="farm"><option value="" data-t="oFarm">Select ranch…</option></select>
      </div>
      <div class="f">
        <label for="variety" data-t="lVar">Variety</label>
        <select id="variety" disabled><option value="" data-t="oVar">Select variety…</option></select>
      </div>
      <div class="f full"><div class="hint" id="blockHint"></div></div>
    </div>
  </div>

  <div class="card hidden" id="cardIn">
    <h2><span class="step">2</span><span data-t="h2">What you hauled</span></h2>
    <div class="grid">
      <div class="f">
        <label for="loads" data-t="lLoads">Number of loads</label>
        <input type="number" id="loads" min="0" step="1" inputmode="numeric" placeholder="0">
      </div>
      <div class="f">
        <label for="avg" data-t="lAvg">Avg lbs per load</label>
        <input type="number" id="avg" min="0" step="100" inputmode="numeric">
        <div class="hint" id="avgHint"></div>
      </div>

      <div class="f full">
        <label data-t="lBasis">Turnout to use</label>
        <div class="seg" role="group" id="basisSeg">
          <button data-b="25" aria-pressed="true" data-t="b25">2025 actual</button>
          <button data-b="custom" aria-pressed="false" data-t="bcustom">Custom</button>
        </div>
      </div>
      <div class="f full hidden" id="wCustom">
        <label for="custom" data-t="lCustom">Custom turnout %</label>
        <input type="number" id="custom" min="0" max="60" step="0.1" inputmode="decimal" placeholder="20.0">
      </div>
    </div>
  </div>

  <div class="out" id="out">
    <div class="card"><div class="empty" data-t="empty">Select a ranch and variety to begin.</div></div>
  </div>

</div>

/* ---------- copy ---------- */
const T = {
  en:{
    eyebrow:"Crop Year 2026", title:"Estimate My Yield",
    sub:"Pick your ranch and variety, enter your loads, and see the estimate with the reasoning behind it.",
    h1:"Your block", h2:"What you hauled",
    lFarm:"Ranch", oFarm:"Select ranch…", lVar:"Variety", oVar:"Select variety…",
    lLoads:"Number of loads", lAvg:"Avg lbs per load",
    lBasis:"Turnout to use", b25:"2025 actual", bcustom:"Custom",
    lCustom:"Custom turnout %", empty:"Select a ranch and variety to begin.",
    needLoads:"Enter your number of loads to see the estimate.",
    heroK:"So far", heroKFull:"Estimated yield", perAc:"lbs per acre",
    tFW:"Field weight", tMeats:"Est. meats", tTO:"Turnout used",
    pace:(l,tot,pa)=>`At 2025's ${tot} loads this pace gives <b>${pa}</b> lbs/acre`,
    vs25:(p,d)=>`${d} vs 2025 (${p} lbs/acre)`,
    whyT:"How we got there",
    fFW:"Field weight", fMeats:"Meats", fYield:"Yield",
    f1:(n,a,f)=>`<b>${n}</b> loads × <b>${a}</b> lbs/load = <b>${f}</b> lbs`,
    f2:(f,to,yr,m)=>`<b>${f}</b> lbs × <b>${to}</b> turnout <span class="src">(${yr})</span> = <b>${m}</b> lbs`,
    f3:(m,ac,pa)=>`<b>${m}</b> lbs ÷ <b>${ac}</b> acres = <b>${pa}</b> lbs/acre`,
    yr25:"2025 actual", yr24:"2024 actual", yrC:"your number",
    s1s:(fw,ld)=>`Average prefilled from 2025: ${fw} lbs over ${ld} loads here.`,
    flagNF:"2025 was never closed out here, so its turnout is unreliable. This estimate uses 2024 instead.",
    flagNo24:"No 2024 turnout on file, so only one year sits behind this.",
    blockHint:(ld,av,pa)=>`2025: <b>${ld}</b> loads · <b>${av}</b> avg lbs/load · <b>${pa}</b> lbs/acre final`,
    copy:"Copy summary", reset:"Start over", copied:"Copied"
  },
  es:{
    eyebrow:"Año de Cosecha 2026", title:"Estimar Mi Rendimiento",
    sub:"Elige tu rancho y variedad, ingresa tus cargas, y mira el estimado con la explicación detrás.",
    h1:"Tu bloque", h2:"Lo que llevaste",
    lFarm:"Rancho", oFarm:"Elegir rancho…", lVar:"Variedad", oVar:"Elegir variedad…",
    lLoads:"Número de cargas", lAvg:"Libras promedio por carga",
    lBasis:"Turnout a usar", b25:"Real 2025", bcustom:"Personalizado",
    lCustom:"Turnout personalizado %", empty:"Elige un rancho y una variedad para empezar.",
    needLoads:"Ingresa tu número de cargas para ver el estimado.",
    heroK:"Hasta ahora", heroKFull:"Rendimiento estimado", perAc:"libras por acre",
    tFW:"Peso de campo", tMeats:"Almendra est.", tTO:"Turnout usado",
    pace:(l,tot,pa)=>`Con las ${tot} cargas de 2025, este ritmo da <b>${pa}</b> lbs/acre`,
    vs25:(p,d)=>`${d} contra 2025 (${p} lbs/acre)`,
    whyT:"Cómo llegamos ahí",
    fFW:"Peso de campo", fMeats:"Almendra", fYield:"Rendimiento",
    f1:(n,a,f)=>`<b>${n}</b> cargas × <b>${a}</b> lbs/carga = <b>${f}</b> lbs`,
    f2:(f,to,yr,m)=>`<b>${f}</b> lbs × <b>${to}</b> turnout <span class="src">(${yr})</span> = <b>${m}</b> lbs`,
    f3:(m,ac,pa)=>`<b>${m}</b> lbs ÷ <b>${ac}</b> acres = <b>${pa}</b> lbs/acre`,
    yr25:"real 2025", yr24:"real 2024", yrC:"tu número",
    s1s:(fw,ld)=>`Promedio de 2025: ${fw} lbs en ${ld} cargas aquí.`,
    flagNF:"El 2025 nunca se cerró aquí, así que su turnout no es confiable. Este estimado usa 2024.",
    flagNo24:"No hay turnout de 2024 registrado, así que solo hay un año detrás de esto.",
    blockHint:(ld,av,pa)=>`2025: <b>${ld}</b> cargas · <b>${av}</b> lbs/carga prom. · <b>${pa}</b> lbs/acre final`,
    copy:"Copiar resumen", reset:"Empezar de nuevo", copied:"Copiado"
  }
};
let lang="en";
const t = () => T[lang];

/* ---------- state ---------- */
let basis="25";
const $ = id => document.getElementById(id);
const nf0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat("en-US",{minimumFractionDigits:1,maximumFractionDigits:1});
const n0 = v => nf0.format(Math.round(v));
const pc = v => nf1.format(v*100)+"%";
const sgn = v => (v>=0?"+":"")+nf1.format(v)+"%";

function cur(){
  const f=$("farm").value, v=$("variety").value;
  if(!f||!v) return null;
  return REF.find(r=>r.farm===f && r.variety===v) || null;
}

/* 2025 actual unless it never closed out, in which case 2024 */
function turnout(r){
  if(basis==="custom"){
    const c=parseFloat($("custom").value);
    return {v:(isNaN(c)?null:c/100), b:"custom"};
  }
  const has25 = r.to25!=null && !r.notFinal;
  if(has25) return {v:r.to25, b:"25"};
  if(r.to24!=null) return {v:r.to24, b:"24"};
  return {v:null, b:"none"};
}

/* ---------- selects ---------- */
function buildFarms(){
  const sel=$("farm"), keep=sel.value;
  sel.innerHTML=`<option value="">${t().oFarm}</option>`;
  [...new Set(REF.map(r=>r.farm))].forEach(f=>{
    const o=document.createElement("option"); o.value=f; o.textContent=f; sel.appendChild(o);
  });
  if(keep) sel.value=keep;
}
function buildVarieties(){
  const sel=$("variety"), f=$("farm").value, keep=sel.value;
  sel.innerHTML=`<option value="">${t().oVar}</option>`;
  sel.disabled=!f;
  if(f) REF.filter(r=>r.farm===f).forEach(r=>{
    const o=document.createElement("option"); o.value=r.variety;
    o.textContent=r.variety; sel.appendChild(o);
  });
  if(keep && [...sel.options].some(o=>o.value===keep)) sel.value=keep;
}

/* ---------- render ---------- */
function applyCopy(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k=el.dataset.t; if(t()[k] && typeof t()[k]==="string") el.textContent=t()[k];
  });
  document.documentElement.lang = lang;
  buildFarms(); buildVarieties(); render();
}

function render(){
  const r=cur(), out=$("out");
  $("cardIn").classList.toggle("hidden", !r);
  if(!r){
    $("blockHint").innerHTML="";
    out.innerHTML=`<div class="card"><div class="empty">${t().empty}</div></div>`;
    return;
  }

  $("blockHint").innerHTML=t().blockHint(r.loads25, n0(r.avgFW), n0(r.lbsAc25));
  if(!$("avg").value || $("avg").dataset.auto==="1"){
    $("avg").value=r.avgFW; $("avg").dataset.auto="1";
  }
  $("avgHint").innerHTML=t().s1s(n0(r.avgFW), r.loads25);

  const to=turnout(r);
  const n=parseFloat($("loads").value), a=parseFloat($("avg").value);
  const fw=(!isNaN(n)&&n>0&&!isNaN(a)&&a>0)? n*a : null;

  if(fw==null || to.v==null){
    out.innerHTML=`<div class="card"><div class="empty">${t().needLoads}</div></div>`;
    return;
  }

  const meats=fw*to.v, perAc=meats/r.acres;
  const partial = r.loads25>0 && n < r.loads25;
  const paceAc = partial ? (r.loads25*a*to.v)/r.acres : perAc;
  const dPace=(paceAc-r.lbsAc25)/r.lbsAc25*100;
  const dNow=(perAc-r.lbsAc25)/r.lbsAc25*100;

  const yrTxt = to.b==="custom"? t().yrC : to.b==="24"? t().yr24 : t().yr25;

  const flags=[];
  if(r.notFinal) flags.push(t().flagNF);
  if(r.to24==null) flags.push(t().flagNo24);

  const fx=[
    {l:t().fFW,    e:t().f1(nf0.format(n), n0(a), n0(fw))},
    {l:t().fMeats, e:t().f2(n0(fw), pc(to.v), yrTxt, n0(meats))},
    {l:t().fYield, e:t().f3(n0(meats), nf1.format(r.acres), n0(perAc)), res:1}
  ];

  out.innerHTML=`
    <div class="hero">
      <div class="k">${partial? t().heroK : t().heroKFull}</div>
      <div class="big">${n0(perAc)} <small>${t().perAc}</small></div>
      ${partial? `<div class="range">${t().pace(n, r.loads25, n0(paceAc))}</div>`:""}
      <div class="cmp ${(partial?dPace:dNow)>=0?"up":"down"}">${t().vs25(n0(r.lbsAc25), sgn(partial?dPace:dNow))}</div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">${t().tFW}</div><div class="v">${n0(fw)}</div></div>
      <div class="tile"><div class="k">${t().tMeats}</div><div class="v">${n0(meats)}</div></div>
      <div class="tile"><div class="k">${t().tTO}</div><div class="v">${pc(to.v)}</div></div>
    </div>

    <div class="card why">
      <h2>${t().whyT}</h2>
      <div class="fx">${fx.map(f=>`<div class="r${f.res?" res":""}"><span class="lb">${f.l}</span><span class="eq">${f.e}</span></div>`).join("")}</div>
    </div>

    ${flags.map(f=>`<div class="flag"><span class="ic">!</span><span>${f}</span></div>`).join("")}

    <div class="actions">
      <button class="btn" id="copyBtn">${t().copy}</button>
      <button class="btn" id="resetBtn">${t().reset}</button>
    </div>`;

  $("copyBtn").onclick = () => {
    const lines=[`${r.farm} · ${r.variety}`,
      `${t().tFW}: ${n0(fw)} lbs`, `${t().tTO}: ${pc(to.v)}`,
      `${t().tMeats}: ${n0(meats)} lbs`,
      `${partial? t().heroK : t().heroKFull}: ${n0(perAc)} ${t().perAc}`];
    if(partial) lines.push(`${nf0.format(n)}/${r.loads25} loads → ${n0(paceAc)} ${t().perAc}`);
    lines.push(t().vs25(n0(r.lbsAc25), sgn(partial?dPace:dNow)));
    navigator.clipboard.writeText(lines.join("\n")).then(()=>{
      $("copyBtn").textContent=t().copied;
      setTimeout(()=>{ const b=$("copyBtn"); if(b) b.textContent=t().copy; },1600);
    }).catch(()=>{});
  };
  $("resetBtn").onclick = () => {
    ["loads","custom"].forEach(id=>$(id).value="");
    $("avg").dataset.auto="1"; $("avg").value=r.avgFW; render();
  };
}

/* ---------- events ---------- */
$("farm").onchange = () => { buildVarieties(); $("avg").dataset.auto="1"; render(); };
$("variety").onchange = () => { $("avg").dataset.auto="1"; render(); };
["loads","custom"].forEach(id=>$(id).oninput=render);
$("avg").oninput = () => { $("avg").dataset.auto="0"; render(); };

$("basisSeg").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  basis=b.dataset.b;
  [...$("basisSeg").children].forEach(x=>x.setAttribute("aria-pressed", x.dataset.b===basis));
  $("wCustom").classList.toggle("hidden", basis!=="custom");
  render();
});
$("btnEn").onclick = () => { lang="en"; $("btnEn").setAttribute("aria-pressed",true); $("btnEs").setAttribute("aria-pressed",false); applyCopy(); };
$("btnEs").onclick = () => { lang="es"; $("btnEs").setAttribute("aria-pressed",true); $("btnEn").setAttribute("aria-pressed",false); applyCopy(); };

applyCopy();
</script>
