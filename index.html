<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yield Assumption Using Field Weights Turnout</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --text:#1d1d1f;
    --secondary:#86868b;
    --hairline:rgba(0,0,0,.08);
    --hairline-soft:rgba(0,0,0,.05);
    --green:#34c759;
    --amber:#ff9f0a;
    --red:#ff3b30;
    --blue:#0071e3;
    --fill:#f5f5f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
    padding:48px 24px 96px;
  }
  .wrap{max-width:1140px;margin:0 auto}

  .eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--secondary);margin-bottom:6px;
  }
  h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
  .sub{color:var(--secondary);font-size:15px;margin-top:8px;max-width:560px}

  .summary{
    display:flex;flex-wrap:wrap;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
    margin:28px 0 24px;
    overflow:hidden;
  }
  .stat{
    flex:1 1 160px;min-width:150px;
    padding:18px 22px 16px;
    border-right:1px solid var(--hairline-soft);
  }
  .stat:last-child{border-right:none}
  .stat .k{font-size:12px;font-weight:500;color:var(--secondary)}
  .stat .v{
    font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;
    font-variant-numeric:tabular-nums;
  }
  .stat .v small{font-size:14px;font-weight:400;color:var(--secondary)}
  .meter{
    height:4px;background:rgba(0,0,0,.06);border-radius:2px;
    margin-top:12px;overflow:hidden;
  }
  .meter i{
    display:block;height:100%;width:0;border-radius:2px;
    background:var(--green);transition:width .5s cubic-bezier(.25,.1,.25,1);
  }
  .meter i.amber{background:var(--amber)}
  .ysub{font-size:11px;color:var(--secondary);margin-top:10px;font-variant-numeric:tabular-nums;min-height:14px}
  .stat .v.neg{color:var(--red)}
  .stat .v.pos{color:var(--green)}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--secondary);cursor:pointer}
  .chk input{accent-color:var(--blue);width:15px;height:15px}
  .fbar{flex:none;width:60px;height:4px;border-radius:2px;background:rgba(0,0,0,.07);overflow:hidden;margin-left:4px}
  .fbar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .4s ease}
  tr.row.unfin td{opacity:.5}
  tfoot tr.sub td{font-weight:500;color:var(--secondary);font-size:13px;border-top:1px solid var(--hairline-soft)}

  .tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  input[type="search"]{
    font:inherit;font-size:14px;
    padding:8px 14px;border:none;border-radius:10px;
    background:rgba(0,0,0,.05);color:var(--text);width:240px;
    outline:none;
  }
  input[type="search"]:focus{box-shadow:0 0 0 3px rgba(0,113,227,.3)}
  .link{
    font:inherit;font-size:14px;color:var(--blue);
    background:none;border:none;cursor:pointer;padding:4px 2px;
  }
  .link:hover{text-decoration:underline}
  .link:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
  .spacer{flex:1}
  .savenote{font-size:12px;color:var(--secondary)}
  .savenote.err{color:var(--red)}

  .card{
    background:var(--card);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 24px rgba(0,0,0,.04);
    overflow-x:auto;
  }
  table{border-collapse:collapse;width:100%;min-width:920px}
  thead th{
    font-size:12px;font-weight:500;color:var(--secondary);
    padding:14px 12px 10px;text-align:right;white-space:nowrap;
    border-bottom:1px solid var(--hairline);
    position:sticky;top:0;background:var(--card);z-index:2;
  }
  thead th:first-child{text-align:left;padding-left:20px}
  thead th.c{text-align:center;width:64px;white-space:normal;line-height:1.2}

  tr.farm td{padding:0;border-top:1px solid var(--hairline-soft)}
  tr.farm:first-child td{border-top:none}
  .band{
    all:unset;display:flex;align-items:center;gap:10px;
    width:100%;padding:13px 20px;box-sizing:border-box;cursor:pointer;
  }
  .band:hover{background:rgba(0,0,0,.02)}
  .band:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
  .chev{
    flex:none;width:8px;height:8px;
    border-right:1.5px solid var(--secondary);border-bottom:1.5px solid var(--secondary);
    transform:rotate(-45deg);transition:transform .18s ease;margin-right:2px;
  }
  tr.farm.open .chev{transform:rotate(45deg)}
  .fname{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .fright{margin-left:auto;display:flex;gap:20px;align-items:baseline}
  .fdone{font-size:12px;color:var(--secondary);font-variant-numeric:tabular-nums}
  .flbs{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .flbs small{font-weight:400;color:var(--secondary)}

  tr.row td{
    padding:8px 12px;text-align:right;white-space:nowrap;
    font-variant-numeric:tabular-nums;
    border-top:1px solid var(--hairline-soft);
  }
  tr.row td.var{text-align:left;padding-left:42px}
  tr.row.hide{display:none}
  td.calcv{font-weight:500}
  .neg{color:var(--red)}
  .pos{color:var(--green)}
  td.prior{color:var(--secondary)}

  td.st{text-align:center;width:64px}
  .dot{
    display:inline-block;width:16px;height:16px;border-radius:50%;
    background:var(--red);vertical-align:middle;
  }
  .dot[data-state="1"]{background:var(--amber)}
  .dot[data-state="2"]{background:var(--green)}

  tfoot td{
    padding:14px 12px;text-align:right;font-weight:600;
    border-top:1px solid var(--hairline);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  tfoot td:first-child{text-align:left;padding-left:20px}

  .note{font-size:12px;color:var(--secondary);margin-top:14px;line-height:1.6}
  .banner{
    display:none;background:#fff4e5;color:#7a4b00;
    border:1px solid #ffd591;border-radius:12px;
    padding:10px 14px;font-size:13px;margin-bottom:16px;
  }
  .banner.show{display:block}

  @media (max-width:640px){
    body{padding:24px 12px 60px}
    h1{font-size:26px}
    input[type="search"]{width:100%}
    .fbar{display:none}
  }
  @media (prefers-reduced-motion:reduce){.chev,.meter i,.fbar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <h1>Yield Assumption Using Field&nbsp;Weights&nbsp;Turnout</h1>

  <div class="banner" id="banner"></div>

  <div class="summary">
    <div class="stat">
      <div class="k">Pickup</div>
      <div class="v" id="sPick"></div>
      <div class="meter"><i id="mPick"></i></div>
    </div>
    <div class="stat">
      <div class="k">Tickets in</div>
      <div class="v" id="sTick"></div>
      <div class="meter"><i id="mTick" class="amber"></i></div>
    </div>
    <div class="stat">
      <div class="k">Blocks closed</div>
      <div class="v" id="sClosed"></div>
      <div class="meter"><i id="mClosed"></i></div>
    </div>
    <div class="stat">
      <div class="k">Yield signal <small>finished blocks</small></div>
      <div class="v" id="sYield"></div>
      <div class="ysub" id="sYieldSub"></div>
    </div>
    <div class="stat"><div class="k">Field weight · lbs</div><div class="v" id="sFW"></div></div>
    <div class="stat"><div class="k">Forecast · lbs</div><div class="v" id="sFcst"></div></div>
  </div>

  <div class="tools">
    <input type="search" id="filter" placeholder="Search" aria-label="Filter rows">
    <button class="link" id="expandAll">Expand all</button>
    <button class="link" id="collapseAll">Collapse all</button>
    <label class="chk"><input type="checkbox" id="onlyFin"> Finished only</label>
    <div class="spacer"></div>
    <button class="link" id="refreshBtn">Refresh</button>
    <span class="savenote" id="savenote"></span>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Farm</th>
          <th class="c">All Pickups?</th>
          <th class="c">All Tickets Submitted?</th>
          <th>Field Weight</th>
          <th>FW '25</th>
          <th>Var vs '25</th>
          <th>Assumption</th>
          <th>Forecast</th>
          <th>Forecast lb/acre</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
      <tfoot>
        <tr>
          <td colspan="3">Total</td>
          <td id="tFW"></td>
          <td id="tFW25"></td><td></td><td></td>
          <td id="tFcst"></td>
          <td></td>
        </tr>
        <tr class="sub">
          <td colspan="3">Finished blocks only</td>
          <td id="tfFW"></td>
          <td id="tfFW25"></td><td id="tfVar"></td><td></td>
          <td id="tfFcst"></td>
          <td id="tfFcstAc"></td>
        </tr>
      </tfoot>
    </table>
  </div>

</div>

<script>
/* ============================================================
   1. PASTE YOUR APPS SCRIPT WEB APP URL BELOW.
      In the Google Sheet: Extensions ▸ Apps Script, paste AppsScript_Code.gs,
      Deploy ▸ Web app (Execute as: Me · Access: Anyone), copy the /exec URL.
      The script returns only the raw columns; this page computes
      lbs/acre, variance vs '25, and forecast itself.
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbz8grVMeVnQK33sRaCTtOBGLDCZiHgJ4YIqowivfd3Lr4vaaqrF21KJBkKhv5U-VAi6/exec";

const CACHE_KEY = "glf-fw-2026-cache";
let ROWS = [];
let openFarms = new Set();     // remember which farms are expanded across refreshes
let expandedOnce = false;      // expand-all applies once, on the first painted data
let onlyFinished = false;      // "Finished only" filter

const fmt0 = new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
const fmt1 = new Intl.NumberFormat("en-US",{maximumFractionDigits:1});
function parseNum(s){
  if(s === "" || s == null) return null;
  const n = parseFloat(String(s).replace(/[,%\s]/g,""));
  return isNaN(n) ? null : n;
}
const fmtLbs = n => n == null ? "" : fmt0.format(Math.round(n));

/* All ticket-gated calcs live here. Nothing computes until tickets == Done (2). */
function calc(r){
  const fw = parseNum(r.fw), a = parseNum(r.assump), ac = parseNum(r.acres);
  const ticketsDone = Number(r.tickets) === 2;
  const fcst = (ticketsDone && fw!=null && a!=null) ? fw*a/100 : null;
  const fcstAc = (fcst!=null && ac!=null && ac!==0) ? fcst/ac : null;
  return { fw, fcst, fcstAc, ticketsDone };
}
/* a block is finished when both lights are green */
function isFin(r){ return Number(r.pickup) === 2 && Number(r.tickets) === 2; }
const pctTxt = v => (v>=0?"+":"") + fmt1.format(v) + "%";

/* per-acre variance vs '25 — also gated on tickets */
function derive(r){
  const fw = parseNum(r.fw), fw25 = parseNum(r.fw25), ac = parseNum(r.acres);
  const ticketsDone = Number(r.tickets) === 2;
  if(ticketsDone && fw!=null && fw25!=null && fw25!==0 && ac!=null && ac!==0){
    const per26 = fw/ac, per25 = fw25/ac;
    r.varAc = per25!==0 ? ((per26-per25)/per25*100) : "";
  } else r.varAc = "";
}

function setNote(msg, isErr){
  const el = document.getElementById("savenote");
  el.textContent = msg || "";
  el.classList.toggle("err", !!isErr);
}
function showBanner(msg){
  const b = document.getElementById("banner");
  if(!msg){ b.classList.remove("show"); return; }
  b.textContent = msg; b.classList.add("show");
}

/* ---------- data loading (Apps Script JSON) ---------- */
async function loadData(initial){
  // 1) INSTANT: paint from cache and don't wait on anything.
  let hadCache = false;
  if(initial){
    const cached = readCache();
    if(cached && cached.rows && cached.rows.length){
      ROWS = cached.rows; ROWS.forEach(derive); render();
      hadCache = true;
      // show when this cached copy is from, quietly — no "refreshing" spinner
      if(cached.updated) setNote("As of " + new Date(cached.updated).toLocaleTimeString());
    }
  }

  if(API_URL === "PASTE_YOUR_WEB_APP_URL_HERE"){
    if(!hadCache) showBanner("No sheet connected yet — paste your Apps Script Web App URL into index.html (API_URL).");
    return;
  }

  // 2) BACKGROUND: fetch fresh data without blocking the painted view.
  //    Only a manual Refresh shows a working state; initial load stays silent.
  if(!initial) setNote("Refreshing…");
  try{
    const url = API_URL + (API_URL.includes("?") ? "&" : "?") + (initial ? "" : "bust=1&") + "_=" + Date.now();
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const rows = data.rows || [];
    if(!rows.length) throw new Error("empty");

    // 3) Only touch the DOM if the data actually changed vs what's shown.
    const fresh = JSON.stringify(rows);
    const shown = JSON.stringify(ROWS.map(stripDerived));
    writeCache({ updated: data.updated || new Date().toISOString(), rows });
    if(fresh !== shown){
      ROWS = rows; ROWS.forEach(derive); render();
    }
    showBanner("");
    const when = data.updated ? new Date(data.updated).toLocaleTimeString() : new Date().toLocaleTimeString();
    setNote("Updated " + when);
  }catch(err){
    if(ROWS.length){
      // we're already showing cached data — keep it, note quietly, don't alarm
      setNote("Showing saved copy", true);
    }else{
      showBanner("Couldn't load the sheet and no cached copy is available. Check the Web App URL and that it's deployed to \u201cAnyone\u201d.");
      setNote("Load failed", true);
    }
  }
}
/* strip client-derived fields so cache-vs-fresh comparison is apples-to-apples */
function stripDerived(r){
  const {varAc, ...raw} = r;
  return raw;
}
function readCache(){
  try{ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function writeCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
}

/* ---------- render ---------- */
function render(){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  const farms = [...new Set(ROWS.map(r=>r.farm))];

  /* first time real data lands, open every ranch */
  if(!expandedOnce && farms.length){
    farms.forEach(f=>openFarms.add(f));
    expandedOnce = true;
  }

  farms.forEach(farm => {
    const ftr = document.createElement("tr");
    ftr.className = "farm" + (openFarms.has(farm) ? " open" : "");
    ftr.dataset.farm = farm;
    ftr.innerHTML = `<td colspan="10">
      <button class="band" aria-expanded="${openFarms.has(farm)}" aria-label="Toggle ${farm}">
        <span class="chev" aria-hidden="true"></span>
        <span class="fname">${farm}</span>
        <span class="fbar" title="Share of blocks finished"><i data-fbar="${farm}"></i></span>
        <span class="fright">
          <span class="fdone" data-fdone="${farm}"></span>
          <span class="flbs" data-flbs="${farm}"></span>
        </span>
      </button></td>`;
    tbody.appendChild(ftr);

    ROWS.filter(r=>r.farm===farm).forEach(r => {
      const c = calc(r);
      const vn = parseNum(r.varAc);
      const tr = document.createElement("tr");
      const fin = isFin(r);
      tr.className = "row" + (openFarms.has(farm) ? "" : " hide") + (fin ? "" : " unfin");
      tr.dataset.farm = farm; tr.dataset.variety = r.variety;
      tr.dataset.fin = fin ? "1" : "0";
      tr.innerHTML = `
        <td class="var">${r.variety}</td>
        <td class="st"><span class="dot" data-state="${r.pickup}" title="${statusLabel(r.pickup)}"></span></td>
        <td class="st"><span class="dot" data-state="${r.tickets}" title="${statusLabel(r.tickets)}"></span></td>
        <td>${r.fw!=="" && r.fw!=null ? fmt0.format(r.fw) : ""}</td>
        <td class="prior">${r.fw25!=="" && r.fw25!=null ? fmt0.format(r.fw25) : ""}</td>
        <td class="${vn!=null&&vn<0?"neg":(vn!=null&&vn>0?"pos":"")}">${r.varAc!=="" && r.varAc!=null ? fmt1.format(r.varAc)+"%" : ""}</td>
        <td>${r.assump!=="" && r.assump!=null ? r.assump+"%" : ""}</td>
        <td class="calcv">${fmtLbs(c.fcst)}</td>
        <td class="calcv">${c.fcstAc!=null ? fmt0.format(c.fcstAc) : ""}</td>`;
      tbody.appendChild(tr);
    });
  });
  applyFilters();
  refreshTotals();
}
function statusLabel(s){ return ["Not done","In progress","Done"][s] || "Not done"; }

function refreshTotals(){
  const n = ROWS.length || 1;
  let pick=0, tick=0, closed=0, fw=0, fw25=0, fcst=0, acres=0;
  let aFW=false, aFc=false, aAc=false, a25=false;
  let fFW=0, fFW25=0, fFcst=0, fAc=0, fN=0;             // finished blocks only
  const gFcst={}, gDone={}, gN={};
  ROWS.forEach(r => {
    const c = calc(r), f = isFin(r);
    const p25 = parseNum(r.fw25), ac = parseNum(r.acres);
    gN[r.farm]=(gN[r.farm]||0)+1;
    if(r.pickup==2) pick++;
    if(r.tickets==2) tick++;
    if(f){ closed++; gDone[r.farm]=(gDone[r.farm]||0)+1; }
    if(ac!=null){acres+=ac;aAc=true}
    if(c.fw!=null){fw+=c.fw;aFW=true}
    if(p25!=null){fw25+=p25;a25=true}
    if(c.fcst!=null){fcst+=c.fcst;aFc=true;gFcst[r.farm]=(gFcst[r.farm]||0)+c.fcst}
    if(f){
      fN++;
      if(c.fw!=null) fFW+=c.fw;
      if(p25!=null) fFW25+=p25;
      if(c.fcst!=null) fFcst+=c.fcst;
      if(ac!=null) fAc+=ac;
    }
  });
  const set=(id,v)=>{const e=document.getElementById(id); if(e) e.textContent=v;};
  const bar=(id,p)=>{const e=document.getElementById(id); if(e) e.style.width=Math.max(0,Math.min(100,p))+"%";};

  document.getElementById("sPick").innerHTML   = pick+`<small> / ${ROWS.length}</small>`;
  document.getElementById("mPick").style.width = (pick/n*100)+"%";
  document.getElementById("sTick").innerHTML   = tick+`<small> / ${ROWS.length}</small>`;
  document.getElementById("sClosed").innerHTML = closed+`<small> / ${ROWS.length}</small>`;
  bar("mTick", tick/n*100); bar("mClosed", closed/n*100);

  /* totals + finished-only subtotal, both on FW '26 vs FW '25 */
  /* variance only on the finished subtotal — comparing a part-finished '26 against
     a full '25 would read as a false decline, so the Total row leaves it blank */
  const vFin = (fFW25>0) ? (fFW-fFW25)/fFW25*100 : null;
  set("tFW25", a25? fmtLbs(fw25):"");

  /* Yield signal: field weight per acre, '26 vs '25, finished blocks only.
     Same acres sit on both sides, so this is the like-for-like read on whether
     the crop is up or down — not a progress number. */
  const yv = document.getElementById("sYield");
  const ys = document.getElementById("sYieldSub");
  if(yv){
    if(vFin!=null && fAc>0){
      yv.textContent = pctTxt(vFin);
      yv.className = "v " + (vFin<0?"neg":"pos");
      if(ys) ys.textContent = fmt0.format(fFW/fAc)+" vs "+fmt0.format(fFW25/fAc)+" lb/ac";
    }else{
      yv.textContent = ""; yv.className = "v";
      if(ys) ys.textContent = fN? "" : "no finished blocks yet";
    }
  }
  set("tfFW",   fN? fmtLbs(fFW):"");
  set("tfFW25", fFW25? fmtLbs(fFW25):"");
  set("tfFcst", fFcst? fmtLbs(fFcst):"");
  set("tfFcstAc", (fFcst&&fAc)? fmt0.format(fFcst/fAc):"");
  const tv=document.getElementById("tfVar");
  if(tv){ tv.textContent = vFin==null? "" : pctTxt(vFin); tv.className = vFin==null? "" : (vFin<0?"neg":"pos"); }

  document.querySelectorAll("[data-fbar]").forEach(el=>{
    const f = el.dataset.fbar; el.style.width = (gN[f]? (gDone[f]||0)/gN[f]*100 : 0)+"%";
  });
  document.getElementById("sFW").textContent = aFW? fmtLbs(fw):"";
  document.getElementById("sFcst").textContent = aFc? fmtLbs(fcst):"";
  const tAc = document.getElementById("tAc");
  if(tAc) tAc.textContent = aAc? fmt1.format(acres):"";
  document.getElementById("tFW").textContent = aFW? fmtLbs(fw):"";
  document.getElementById("tFcst").textContent = aFc? fmtLbs(fcst):"";
  document.querySelectorAll("[data-fdone]").forEach(el=>{
    const f = el.dataset.fdone; el.textContent = (gDone[f]||0)+"/"+gN[f]+" done";
  });
  document.querySelectorAll("[data-flbs]").forEach(el=>{
    const f = el.dataset.flbs;
    el.innerHTML = gFcst[f]!=null ? fmtLbs(gFcst[f])+" <small>lbs</small>" : "";
  });
}

/* ---------- expand / collapse ---------- */
function setOpen(ftr, open){
  const farm = ftr.dataset.farm;
  ftr.classList.toggle("open", open);
  ftr.querySelector(".band").setAttribute("aria-expanded", open);
  if(open) openFarms.add(farm); else openFarms.delete(farm);
  document.querySelectorAll(`tr.row[data-farm="${farm}"]`)
    .forEach(tr => tr.classList.toggle("hide", !open || tr.dataset.filtered === "1"));
}
document.getElementById("tbody").addEventListener("click", e => {
  const band = e.target.closest(".band");
  if(band){
    const ftr = band.closest("tr.farm");
    setOpen(ftr, !ftr.classList.contains("open"));
  }
});
document.getElementById("expandAll").onclick = () =>
  document.querySelectorAll("tr.farm").forEach(t=>setOpen(t,true));
document.getElementById("collapseAll").onclick = () =>
  document.querySelectorAll("tr.farm").forEach(t=>setOpen(t,false));

/* ---------- filter ---------- */
function applyFilters(){
  const q = document.getElementById("filter").value.trim().toLowerCase();
  document.querySelectorAll("tr.row").forEach(tr=>{
    const textHit = !q || tr.dataset.farm.toLowerCase().includes(q) || tr.dataset.variety.toLowerCase().includes(q);
    const finHit  = !onlyFinished || tr.dataset.fin === "1";
    tr.dataset.filtered = (textHit && finHit) ? "0" : "1";
  });
  document.querySelectorAll("tr.farm").forEach(ftr=>{
    const f = ftr.dataset.farm;
    const rows = [...document.querySelectorAll(`tr.row[data-farm="${f}"]`)];
    const anyHit = rows.some(tr=>tr.dataset.filtered!=="1");
    ftr.style.display = anyHit ? "" : "none";
    if(q && anyHit) openFarms.add(f);
    const open = anyHit && openFarms.has(f);
    ftr.classList.toggle("open", open);
    ftr.querySelector(".band").setAttribute("aria-expanded", open);
    rows.forEach(tr => tr.classList.toggle("hide", !open || tr.dataset.filtered === "1"));
  });
}
document.getElementById("filter").addEventListener("input", applyFilters);
document.getElementById("onlyFin").addEventListener("change", e => {
  onlyFinished = e.target.checked; applyFilters();
});

/* ---------- refresh ---------- */
document.getElementById("refreshBtn").onclick = () => loadData(false);

loadData(true);
</script>
</body>
</html>
